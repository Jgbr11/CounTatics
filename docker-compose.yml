name: countatic

# ═══════════════════════════════════════════════════════════════════
# PUBLICAÇÃO DE PORTAS — todas presas a 127.0.0.1, de propósito.
#
# "8080:8080" liga em 0.0.0.0: qualquer host da rede local alcança a
# API. Isso importa porque nenhum serviço aqui tem autenticação, e a
# API expõe POST /api/matches/{id}/reparse, que APAGA uma partida,
# seus rounds, seus eventos e as estatísticas — irreversível quando a
# demo já saiu do CDN da Valve. O bot na 3000 envia mensagens na Steam
# em nome da conta do usuário, e o MySQL na 3306 tem senha de dev.
#
# Prender em 127.0.0.1 não quebra nada: os serviços conversam entre si
# pelo nome dentro da rede countatic-net (mysql-db, steam-bot,
# parser-service), não pelas portas publicadas. Estas existem só para o
# navegador e as ferramentas do próprio host — inclusive o CS2, que
# manda o Game State Integration para http://127.0.0.1:8080/api/gsi.
#
# Se um dia a API precisar ser alcançada de outra máquina, o passo que
# vem ANTES de reabrir a porta é colocar autenticação nela.
# ═══════════════════════════════════════════════════════════════════

services:
  # ═════════════════════════════════════════════════════════════════
  # 1. BANCO DE DADOS RELACIONAL (MySQL 8.4)
  # ═════════════════════════════════════════════════════════════════
  mysql-db:
    image: mysql:8.4
    container_name: countatic-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: countatic_root_dev
      MYSQL_DATABASE: countatic
      MYSQL_USER: countatic
      MYSQL_PASSWORD: countatic_dev
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - countatic-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pcountatic_root_dev || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ═════════════════════════════════════════════════════════════════
  # 2. CORE BACKEND (Java 21 / Spring Boot) — O Cérebro
  # ═════════════════════════════════════════════════════════════════
  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: countatic-core-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/countatic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: countatic
      SPRING_DATASOURCE_PASSWORD: countatic_dev
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVICES_PARSER_URL: http://parser-service:8081
      SERVICES_BOT_URL: http://steam-bot:3000
      # Segredos vêm do ./.env (git-ignored). Ver .env.example.
      # A sintaxe ":?" faz o compose falhar cedo com mensagem clara
      # em vez de subir com uma chave vazia e dar 403 silencioso.
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:?defina STEAM_WEB_API_KEY no arquivo .env}
      BOT_STEAM_ID: ${BOT_STEAM_ID:-}
      DEMO_TEMP_DIR: /tmp/demos
      GSI_TOKEN: ${GSI_TOKEN:-}
      # Vazio desliga o login com a Steam; o resto do sistema segue igual.
      SESSION_SECRET: ${SESSION_SECRET:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
    depends_on:
      mysql-db:
        condition: service_healthy
      parser-service:
        condition: service_started
      steam-bot:
        condition: service_started
    networks:
      - countatic-net
    # Demos são baixadas em streaming para disco, não para o heap.
    tmpfs:
      - /tmp/demos:size=4g

  # ═════════════════════════════════════════════════════════════════
  # 3. DEMO PARSER (Go / demoinfocs-golang) — O Worker
  # ═════════════════════════════════════════════════════════════════
  parser-service:
    build:
      context: ./demo-parser
      dockerfile: Dockerfile
    container_name: countatic-demo-parser
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      PARSER_PORT: "8081"
    networks:
      - countatic-net

  # ═════════════════════════════════════════════════════════════════
  # 4. STEAM BOT (TypeScript / Node.js) — O Mensageiro
  # ═════════════════════════════════════════════════════════════════
  steam-bot:
    build:
      context: ./steam-bot
      dockerfile: Dockerfile
    container_name: countatic-steam-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./steam-bot/.env
    environment:
      BOT_PORT: "3000"
      TOKEN_FILE: /app/data/refreshToken.txt
    volumes:
      # Volume nomeado (read-write) em vez do bind ":ro" antigo: o steam-user
      # renova o refresh token periodicamente e precisa poder gravá-lo, senão
      # o token expira e o bot volta a pedir código por e-mail.
      - steam-bot-data:/app/data
    networks:
      - countatic-net

# ═════════════════════════════════════════════════════════════════
# REDES E VOLUMES
# ═════════════════════════════════════════════════════════════════
networks:
  countatic-net:
    driver: bridge
    name: countatic-net

volumes:
  mysql-data:
    name: countatic-mysql-data
  steam-bot-data:
    name: countatic-steam-bot-data
